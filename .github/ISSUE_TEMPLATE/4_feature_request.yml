name: Feature request
description: An idea for something Thorough Homesteading could do.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      placeholder: A new Hearth tier.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What you're trying to do in game, and what you do now instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What part of Thorough Homesteading is it about?
      options:
        - Hearths and upgrades
        - The home check or arrival
        - Professions and trades
        - Recipes and balance
        - Settings and config
        - Scripting
        - Compatibility with another mod
        - Something else
    validations:
      required: true
  - type: textarea
    id: mockup
    attributes:
      label: Sketch or example
      description: A mockup, a screenshot from another mod, or a short description of how it would work.
